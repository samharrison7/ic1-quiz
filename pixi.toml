[project]
authors = ["Sam Harrison <samharrison.xg@gmail.com>"]
channels = ["conda-forge"]
description = "UKCEH booth quiz for the first International Conference of the Global Framework on Chemicals (IC1)"
name = "ic1-quiz"
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

[tasks]
# Serve the page locally at http://localhost:4300
serve = "python -m http.server 4300"
# Regenerate the QR code shown on the booth display (edit the URL in tools/make_qr.py)
qr = "python tools/make_qr.py"
# Run supabase/schema.sql against a throwaway local Postgres and check its rules
test-db = "bash tools/test_schema.sh"

[dependencies]
python = ">=3.12,<3.14"
segno = ">=1.6,<2"
postgresql = ">=16,<18"
